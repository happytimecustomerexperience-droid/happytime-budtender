{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Door · Budtender POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pos/app.css' %}">
  <script src="{% static 'pos/htmx.min.js' %}" defer></script>
  <script src="{% static 'pos/app.js' %}" defer></script>
  <script src="{% static 'pos/idscan.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<header class="top">
  <span class="logo">HAPPY&nbsp;TIME</span>
  <span class="muted" style="margin-left:8px">Door · {{ store|title }}</span>
  <span class="spacer"></span>
  <a class="link" href="{% url 'screen' %}">Browse menu</a>
  <a class="link" href="{% url 'logout' %}">Sign out</a>
</header>

<div class="auth" style="max-width:460px">
  <div class="card">
    <h2 style="font-size:14px">Check in a customer</h2>
    <p class="hint" style="margin-top:4px">Scan the ID (21+ auto-check) or enter a phone/name, then add them to the queue for a budtender.</p>

    <form id="doorform" hx-post="{% url 'door_scan' %}" hx-target="#door-result" enctype="multipart/form-data" class="stack"
          hx-on::after-request="if(event.detail.successful) this.reset()">
      <label style="display:block;font-size:12px;color:var(--sage);margin:10px 0 4px">Scan ID (camera)</label>
      <input type="file" name="images" accept="image/*" capture="environment" multiple style="width:100%">
      <button type="button" class="ghost idscan__toggle" data-target="door-idscan">Scan barcode on device</button>
      <div id="door-idscan" class="idscan" hidden>
        <video class="idscan__video" autoplay playsinline muted></video>
        <p id="door-idscan-status" class="muted" style="margin-top:8px"></p>
        <div class="idscan__actions"><button type="button" class="ghost idscan__close" data-target="door-idscan">Close scanner</button></div>
      </div>
      <input type="hidden" id="id_payload" name="id_payload" value="">
      <label style="display:block;font-size:12px;color:var(--sage);margin:12px 0 4px">Phone / name (optional)</label>
      <input type="text" name="phone" inputmode="tel" placeholder="509… or name" style="width:100%" autocomplete="off">
      <button type="submit" style="width:100%;margin-top:16px;min-height:48px">Add to queue</button>
    </form>

    <div id="door-result" style="margin-top:12px"></div>

    <h3 class="muted" style="font-size:12px;margin:18px 0 6px">Queued this shift</h3>
    <div id="door-shift-list" class="vtable queue"></div>
  </div>
</div>
</body>
</html>
