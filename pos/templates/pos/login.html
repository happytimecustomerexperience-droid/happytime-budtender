{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Budtender POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pos/app.css' %}">
</head>
<body>
<header class="top"><span class="logo">HAPPY&nbsp;TIME</span><span class="muted" style="margin-left:8px">Budtender POS</span></header>
<div class="auth">
  <div class="card">
    <h2>Sign in</h2>
    {% if form.errors %}<p class="err">Wrong username or password.</p>{% endif %}
    <form method="post" action="{% url 'login' %}" class="stack">
      {% csrf_token %}
      <label for="id_username">Username</label>{{ form.username }}
      <label for="id_password">Password</label>{{ form.password }}

      <label>Role</label>
      <div class="roletoggle">
        <label><input type="radio" name="role" value="budtender" checked> Budtender</label>
        <label><input type="radio" name="role" value="door"> Door</label>
      </div>

      <label for="id_location">Location</label>
      <select name="location" id="id_location">
        {% for s in stores %}<option value="{{ s }}">{{ s|title }}</option>{% endfor %}
      </select>

      <label for="id_register">Register</label>
      <select name="register" id="id_register">
        {% for r in registers %}<option value="{{ r.id }}" data-store="{{ r.store }}">{{ r.name }}{% if r.room %} · {{ r.room }}{% endif %}</option>{% endfor %}
      </select>

      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
<script>
// Show only the registers for the chosen location (admins pick a superuser role server-side).
(function () {
  var loc = document.getElementById('id_location'), reg = document.getElementById('id_register');
  if (!loc || !reg) return;
  function sync() {
    var s = loc.value, first = null;
    Array.prototype.forEach.call(reg.options, function (o) {
      var show = o.getAttribute('data-store') === s;
      o.hidden = !show; o.disabled = !show;
      if (show && first === null) first = o;
    });
    if (!reg.selectedOptions.length || reg.selectedOptions[0].hidden) { if (first) first.selected = true; }
  }
  loc.addEventListener('change', sync); sync();
})();
</script>
</body>
</html>
