  source_of_truth: kb.FAQEntry(payment) + kb.StoreFact(global, payment)
  expect_grounded: true

- id: address-no-slug-leak
  category: store-facts
  question_variants:
    - "what is the address"
    - "perfect, what is the address"
  store: mount-vernon
  must_include: ["{{storefact:mount-vernon:address|address}}"]
  must_not_include: ["(?i)^mount-vernon\\b", "(?i)^yakima\\b", "(?i)^pullman\\b"]
  channels: [text, playground, web]
  source_of_truth: kb.StoreFact(mount-vernon, address)
  expect_grounded: true
  owner_note: "Pins the internal-label-leak fix: the spoken answer must open with the human label ('Mt Vernon address: ...'), never the raw store slug chunk_text() carries for retrieval ('mount-vernon Mt Vernon address: ...')."

- id: holiday-hours
  category: store-facts
  question_variants:
    - "are you open on Thanksgiving"
    - "what about Christmas, same hours?"
  must_include: ["{{faq:holiday-hours|first}}"]
