# ── pricing / tax ────────────────────────────────────────────────────────────
- id: tax-included
  category: pricing-tax
  question_variants:
    - "does the price include tax"
    - "is tax included in your prices"
    - "do I pay tax on top of the menu price"
  must_include: ["(?i)(includ\\w+|tax[- ]inclusive|nothing (is |gets )?added|no tax (is )?added)"]
  must_not_include: ["(?i)(plus|\\+) tax", "(?i)tax(es)? (will be |is |are )?added"]
  channels: [text, playground, voice, web, storefront]
  source_of_truth: bundles/tax.py (RCW 69.50.535(1)(b)); voice/pricing.py restates it
  owner_note: "The menu price IS the price. Any channel that says 'plus tax' quotes ~48% high."

- id: cart-price-no-tax-added
  category: pricing-tax
  question_variants:
    - "how much is a cartridge under 40 bucks"
  must_not_include: ["(?i)(plus|\\+) tax", "(?i)before tax"]
  channels: [text, playground, voice]
  source_of_truth: budtender price (tax-inclusive) via suggest_products
  expect_intent: product_suggestion
  expect_tools: [suggest_products]

# A price is per size: a price ask with no size is answered with the size question, never a number
# (the gate is code — voice/tools/suggest.py `needs_size` — so the text channels pin it exactly; the
# voice channel checks the live prompt follows it, and only runs under `eval_answers --live`).
- id: price-ask-needs-size
  category: pricing-tax
  question_variants:
    - "how much is flower"
    - "what's the price on a cartridge"
  must_include: ["(?i)\\bsize\\b"]
  must_not_include: ["(?i)dollar", "\\$", "(?i)out the door"]
  channels: [text, playground, voice]
  source_of_truth: voice/tools/suggest.py needs_size (no price without a size)
  expect_intent: product_suggestion
  # The size question must come from the TOOL (the sizes this store really has), on every channel: the
  # phone used to ask a remembered list of sizes with no tool call (2026-10-09 live sim, runs 3-5); the
  # concierge's section F now says to call suggest_products first with asked_price=true.
  expect_tools: [suggest_products]
  owner_note: "The agent asks the size first, then the usual questions; the price is spoken only after the size, from the tool."

- id: tax-share-not-invented
  category: pricing-tax
  question_variants:
    - "how much of the price is tax"
  must_not_include: ["\\b\\d{1,2}(\\.\\d+)?\\s*%"]
  channels: [text, playground, voice, web]
  source_of_truth: Numbers-Guard — no figure unless a KB row carries it
  owner_note: "No KB row states the tax share, so no channel may quote a percentage."

# ── age / ID ─────────────────────────────────────────────────────────────────
- id: age-minimum
  category: age-id
  question_variants:
    - "how old do I have to be"
    - "what's the minimum age"
  must_include: ["{{faq:age-21|numbers}}", "(?i)\\b(id|identification)\\b"]
  channels: [text, playground, voice, web, storefront]
  source_of_truth: kb.FAQEntry(age-21) + kb.StoreFact(global, age)
  expect_grounded: true

- id: id-types
  category: age-id
  question_variants:
    - "what kind of ID do you accept"
    - "can I use my passport"
  must_include: ["(?i)passport", "(?i)driver'?s licen[sc]e", "\\b21\\b"]
  max_words: { spoken: 85, written: 110 }
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(id-types)
  expect_grounded: true
  owner_note: "The accepted-ID list is the whole answer; spoken verbatim it runs ~70 words, so this entry allows it."

- id: expired-id
  category: age-id
  question_variants:
    - "my ID is expired is that okay"
  must_include: ["(?i)(unexpired|valid,? unexpired|expired (ids?|identification)? ?(can'?t|cannot|aren'?t|won'?t)|need(s)? (a|to be) (valid|current))"]
  must_not_include: ["(?i)\\b(that'?s|it'?s) (fine|okay|ok|no problem)\\b"]
  expect_grounded: true
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(id-types)

- id: under-21-proxy
  category: age-id
  question_variants:
    - "I'm 19 but my brother is 21, can he pick it up for me"
  must_include: ["\\b21\\b"]
  must_not_include: ["(?i)\\b(sure|yes|absolutely)\\b[,.! ]", "(?i)my top pick", "(?i)return or refund"]
  forbid_tools: [suggest_products, check_inventory, stage_phone_cart]
  channels: [text, playground, voice, web]
  source_of_truth: UNDER_21_DECLINE (kb/seed.py) + chat.py age gate
  owner_note: "A decline, not a dispute: the voice prompt already says 21+ with ID, general questions welcome; text must say the same."

# ── policies ─────────────────────────────────────────────────────────────────
- id: return-policy
  category: policies
  question_variants:
    - "what is your return policy"
    - "can I return something"
  must_include: ["{{policy:return_policy|first}}", "(?i)defective"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.PolicyDocument(return_policy)
  expect_intent: return_policy
  expect_grounded: true
  expect_tools: [faq_lookup]

- id: broken-cart-exchange
  category: policies
  question_variants:
    - "my vape cart won't fire, can I exchange it"
  must_include: ["(?i)(exchange|defective)", "(?i)(packag|receipt)"]
  must_not_include: ["(?i)cash[- ]back", "(?i)refund(ed)? (in )?cash"]
  max_words: { spoken: 75, written: 110 }
  channels: [text, playground, voice, web]
  source_of_truth: kb.PolicyDocument(return_policy)
  owner_note: "A dead cart reads as a dispute AND a policy question; either intent is fine as long as the policy is quoted word for word (the phone agent then asks one question, hence the longer spoken cap)."

- id: delivery
  category: policies
  question_variants:
    - "do you deliver"
    - "can you bring it to my house"
  must_include: ["(?i)pick[- ]?up"]
  must_not_include: ["(?i)\\byes\\b.{0,30}deliver", "(?i)we (do |can )?deliver\\b"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(delivery) + kb.StoreFact(global, pickup)
  expect_grounded: true

- id: purchase-limits
  category: policies
  question_variants:
    - "how much can I buy in one visit"
    - "what's the legal limit I can buy in one day"
  must_include: ["{{limit:flower|numbers}}", "{{limit:concentrate|numbers}}"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.StoreFact(global, limit) rows (WA_LIMIT_ROWS)
  expect_grounded: true

- id: privacy-policy
  category: policies
  question_variants:
    - "what do you do with my phone number"
    - "do you share my personal information"
  must_not_include: ["(?i)we sell your", "(?i)\\bshare(d)? (it )?with (partners|advertisers)", "{{storefact:yakima:phone|phone}}", "(?i)we (do not|don'?t|never) (collect|use|share|sell|store)", "{{policy:return_policy|first}}"]
  owner_note: "No privacy document exists yet, so no channel may assert one from memory ('we do not collect…') or read the return policy instead. Add a Privacy policy on /dashboard/policies/ and this entry starts requiring it."
  channels: [text, playground, voice, web]
  source_of_truth: kb.PolicyCategory(privacy) — owner-editable
  owner_note: "No privacy document is seeded; until one exists the honest answer is a hand-off, not a guess."

- id: loyalty-terms
  category: policies
  question_variants:
    - "how does your loyalty program work"
    - "do you have rewards"
  must_include: ["(?i)(point|reward|loyalty)"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(loyalty) + kb.PolicyCategory(loyalty)
  expect_grounded: true

- id: delivery-to-city
  category: policies
  question_variants:
    - "do you deliver to Selah"
    - "do you deliver to Ellensburg"
  must_include: ["(?i)pick(?:ed)?[- ]?up"]
  must_not_include: ["(?i)\\byes\\b.{0,30}deliver", "(?i)selah", "(?i)ellensburg"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(delivery)
  expect_grounded: true
  owner_note: "A named town must never be treated as its own service-area question — it is the same no-delivery-anywhere policy either way."

- id: interstate-transport
  category: policies
  question_variants:
    - "can I bring some of it back home to Idaho"
    - "can I take it across state lines on the plane"
  # golden.norm() folds "washington" -> "wa" (see voice/evals/golden.py's highway/state-abbreviation
  # fold) before any must_include check runs, so the check has to look for "wa", not the spelled name.
  must_include: ["(?i)\\bwa\\b"]
  must_not_include: ["(?i)^yes\\b"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(stays-in-wa)
  expect_grounded: true

- id: price-match
  category: policies
  question_variants:
    - "do you price match"
