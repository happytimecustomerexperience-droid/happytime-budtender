# Golden answer set — the contract every channel is scored against.
#
# One entry per question. `must_include` / `must_not_include` are regexes OR `{{…}}` fact
# templates resolved against the live KB at test time (see voice/evals/golden.py). This file
# never carries an hour, a price, a phone number or a deal literal — if it did, the fact would
# have two sources again. Legal/policy nouns (cash, debit, passport, defective) are fine.
#
# channels: which adapters must pass. voice = Gemini running the published Vapi prompt with the
# real tools; web = the website view through the shared brain; storefront = /custom-order copy;
# pos = the register's education helper. web-fallback is scored separately (never listed here:
# it is scored on every entry that lists `web`, so its gap is always visible).
#
# Owner-facing: edit questions or add entries freely; `owner_note` is for you.

# ── store facts ──────────────────────────────────────────────────────────────
- id: hours-yakima
  category: store-facts
  question_variants:
    - "what are your hours in yakima"
    - "what time do you close tonight in yakima"
    - "yakima hours?"
  store: yakima
  must_include: ["{{storefact:yakima:hours|times}}"]
  channels: [text, playground, voice, web, storefront]
  source_of_truth: kb.StoreFact(yakima, hours)
  expect_intent: hours_location
  expect_grounded: true
  expect_tools: [faq_lookup]

- id: hours-mount-vernon
