  expect_intent: hours_location
  expect_grounded: true

- id: address-yakima
  category: store-facts
  question_variants:
    - "where are you located in yakima"
    - "what's the yakima address"
  store: yakima
  must_include: ["{{storefact:yakima:address|address}}"]
  channels: [text, playground, voice, web, storefront]
  source_of_truth: kb.StoreFact(yakima, address)
