  must_include: ["(?i)don'?t price[- ]match"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(price-match)
  expect_grounded: true
  owner_note: "NEW COPY — REQUIRES OWNER SIGN-OFF: a business-policy claim ('we don't price-match'), not a cited WA-law fact like the rest of this category."

- id: identity-check
  category: policies
  question_variants:
    - "is this Pizza Hut"
    - "what business is this"
  must_include: ["(?i)happy time"]
  must_not_include: ["(?i)pizza hut"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.FAQEntry(identity)
  expect_grounded: true

- id: careers-hiring
  category: policies
  question_variants:
    - "are you hiring"
    - "can I drop off a resume"
  must_include: ["(?i)resume"]
  must_not_include: ["(?i)\\bvendor\\b"]
  channels: [text, playground, voice, web]
  source_of_truth: "kb.FAQEntry(site-faq-18) — paraphrases added so 'are you hiring'/'drop off a resume' reach the existing apply-for-a-position row"
  expect_grounded: true

- id: other-policy
  category: policies
  question_variants:
    - "can I smoke in your parking lot"
  must_not_include: ["(?i)\\b(sure|yes|go ahead|absolutely)\\b"]
  channels: [text, playground, voice, web]
  source_of_truth: kb.PolicyCategory(other) — owner-editable
  owner_note: "Public consumption is illegal in WA; the answer must never be a yes."

