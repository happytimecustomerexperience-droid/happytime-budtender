  owner_note: "The KB has no per-holiday hours row, so the answer must be the general hedge and must never name (confirm or deny) a specific holiday."

- id: drive-thru
  category: store-facts
  question_variants:
    - "do you have a drive-thru"
    - "how late is the drive-thru open"
  must_include: ["(?i)(no|do(n'?t| not) have a|without a) drive[- ]?thr(u|ough)"]
