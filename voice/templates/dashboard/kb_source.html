{% extends "dashboard/base.html" %}
{% block title %}{{ label }} — KB — Happy Time Voice{% endblock %}
{% block content %}
<p class="muted"><a href="{% url 'dash-kb' %}">← Knowledge base</a></p>
<div class="row between">
  <h1>{{ label }}</h1>
  <a class="btn btn-primary" href="{% url 'dash-kb-row-new' kind %}?next={{ next_url|urlencode }}"
     hx-get="{% url 'dash-data-row-new' ds.key %}" hx-target="#new-row-host" hx-swap="innerHTML">+ New row</a>
</div>

<form method="get" class="row" style="margin:12px 0">
  <input name="q" value="{{ q }}" placeholder="search…" style="max-width:280px">
  <button class="btn" type="submit">Search</button>
</form>

{% include "dashboard/_bulk_toolbar.html" %}

<div id="data-list">
{% include "dashboard/_data_list.html" %}
</div>
{% endblock %}
