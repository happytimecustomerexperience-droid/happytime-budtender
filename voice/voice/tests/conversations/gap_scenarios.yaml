# conversation-gaps.yaml — NEW scenarios for the shared customer brain
# (voice/voice/chat.py::answer_text_chat + the tools the Vapi squad shares).
#
# Built by reading: voice/tests/conversations/test_thread_01..22*, test_score_01..04*,
# kb/golden/answers.yaml (incl. the 13 flows), kb/seed.py (FAQ_ROWS, STORE_FACT_ROWS, policy,
# education, prompt bodies), kb/data/site_faqs.json, voice/safety_copy.py, chat.py routing regexes,
# kb/semantic.py retrieval + relevance floor, voice/tools/{faq,suggest,phone_cart,escalation}.py,
# budtender/serializers.py + new_drops.py. Nothing here repeats an utterance or a behaviour a
# thread/score/golden entry already pins.
#
# HOW TO READ AN ENTRY
#   turns   : caller turns in order (the harness's convo.say()). Earlier turns only set up state.
#   expect  : applies to the FINAL turn's reply.  must = every regex must match the answer;
#             must_not = no regex may match; tools = tools that must appear in that turn's
#             tool_results; intent/grounded/escalated = the Turn properties of the same name.
#   phone   : optional E.164 on the session (same key golden/answers.yaml uses).
#   note    : starts with a tag, then one line of why it matters.
#             [LIKELY FAIL] traced through the code by hand: today's brain does NOT meet expect.
#             [RISK]        retrieval/ranking dependent; could pass or fail, worth pinning.
#             [PIN]         today's honest behaviour already meets expect; pin it so it stays that way.
#
# FIXTURE ADDITIONS NEEDED (conftest.py CATALOG / FakeBudtender)
#   * coa-/menu-link scenarios: give FL-BBOG-35 a coa_url ("https://example.test/coa/bbog.pdf") and
#     CT-JETTY-1G a menu_slug; leave CT-DRUM-1G with neither. FakeBudtender.search must return them.
#   * No tincture row in CATALOG on purpose: the honest answer there is an empty search, not a pick.
#   * Specials: kb/seed.py SPECIAL_WINDOW is July 2026, so on 2026-10-01 faq_lookup's specials branch
#     returns the "no specials posted" fallback unless the test seeds current rows.
#
# ROOT CAUSES BEHIND THE LIKELY FAILS (chat.py unless noted)
#   - no crisis/self-harm route: guardrails.in_scope/_CRISIS has no caller (guardrails.py L189-208);
#     _is_ingestion_emergency needs a third-party subject (L659-750), so "I ate too much" is a pitch.
#   - _UNDERAGE_RE is digits-only and needs "I'm <n>" (L950-963): "nineteen", "just turned 20",
#     "born in 2007" are not under-21 admissions.
#   - _HOURS_LOC_RE (L1514) has bare words phone/hours/open/close/address that hijack unrelated asks
#     into the topic-scoped hours_location corpus (no relevance floor, no education rows).
#   - _STAGE_RE (L1285) knows only set..aside / hold..for me / put me down / pick up later, and a phone
#     number given AFTER "what's the best phone number to put it under?" never re-triggers staging.
#   - _HUMAN_RE (L55) has no leak/clog/dead/stopped-working/dry vocabulary; _HUMAN_ROLE lacks owner;
#     _HUMAN_REQUEST_RE needs a verb shape, and any match speaks the refund-dispute copy.
#   - _VENDOR_RE (L1261): "distributor" is too broad, "I've got a delivery"/"pick up the return" too narrow.
#   - _BRAND_MENTION_RE is case-sensitive (L290); _CATEGORY_RE has no tincture/zip/Spanish nouns (L154);
#     _PRICE_MAX_RE needs under/below/less than/up to/max before the number and _PRICE_WORDS starts at ten.
#   - voice/tools/suggest.py::_SPEAKABLE_FIELDS (L63) drops coa_url and menu_slug that
#     budtender/serializers.public_product now emits, and chat.py has no COA / new-drops route.
#   - voice/routing.py::_VENDOR (phone entry mirror) treats "samples" and "drop off" as vendor, so on the
#     phone "can I drop off a resume" / "do you have free samples" would reach the vendor member. Not
#     exercised by answer_text_chat; worth classify_intent cases of its own.

# ═══════════════════════════ PRODUCTS: brand / strain / price / stock ═══════════════════════════

- id: lowercase-brand-jetty
  class: product-brand
  store: yakima
  turns: ["you guys carry jetty?"]
  expect:
    tools: [suggest_products]
    grounded: true
    must: ['(?i)jetty']
  note: "[LIKELY FAIL] _BRAND_MENTION_RE is case-sensitive, so a typed or transcribed lowercase brand gets no brand slot and no category, and the turn drops to a FAQ miss (thread 19 only tries capitalised Phat Panda / Cookies)."

- id: lowercase-strain-blue-dream
  class: product-strain
  store: yakima
  turns: ["got any blue dream"]
  expect:
    tools: [suggest_products]
    must: ['(?i)blue dream']
  note: "[LIKELY FAIL] same root: a bare strain name with no category word and no capital letter is invisible to the router, so a real shopping ask ends as 'I'm not certain on that one'."
  owner_question: "2026-10-01: the shelf is now searched for 'blue dream' and the top pick IS a Blue Dream product (Single Pre-roll 1g), but the spoken pick line names only product + brand, never the strain. Should a pick line add the strain when the caller asked by strain (e.g. 'Roller Co Single Pre-roll 1g, Blue Dream')? It changes every spoken pick, so it needs your OK."

- id: named-sku-price-eighth-substitution
  class: price-of-named-sku
  store: yakima
  turns: ["how much is the Blueberry OG eighth"]
  expect:
    tools: [suggest_products]
    must: ['(?i)blueberry']
    must_not: ['(?i)gorilla']
  note: "[LIKELY FAIL] category+size are derived but the brand slot only fires after carry/stock/have verbs, so the lead pick is whatever ranks first (GG4 in the fake). Same root as thread 10 turn 2 FINDING, on a fresh flower SKU; data-integrity rule: never substitute a different item."

- id: compare-thc-two-named-products
  class: which-is-stronger
  store: mount-vernon
  turns: ["which has more THC, the Jetty Blue Dream cart or the Drum Roll Granddaddy"]
  expect:
    must: ['(?i)((drum roll|granddaddy).*(jetty|blue dream)|(jetty|blue dream).*(drum roll|granddaddy)|team member|budtender)']
  note: "[LIKELY FAIL] 'cart' derives category=cartridge only, so the reply leads with a third product (cheapest cart) and never compares the two named ones. Honest outcomes: compare from tool thc_percent (Numbers-Guard allows tool numbers) or hand off."

- id: highest-thc-flower-no-claim
  class: thc-percent
  store: yakima
  turns: ["what's your highest THC flower"]
  expect:
    intent: product_suggestion
    tools: [suggest_products]
    must_not: ['(?i)\b(highest|strongest|most potent)\b']
  note: "[PIN] there is no THC sort/min slot (_PRODUCT_SLOT_KEYS, TOOL_SPECS), so a ranked pick must not be dressed up as 'the highest THC'."

- id: thc-floor-filter-over-30
  class: thc-percent
  store: pullman
  turns: ["anything over 30 percent THC"]
  expect:
    must: ['(?i)(team member|budtender|not certain|can.?t (filter|confirm)|top pick)']
    must_not: ['(?i)(over|above|more than) (30|thirty)\b', '\b3\d(\.\d)? ?%']
  note: "[PIN] no thc_min slot exists; the honest answers are a hand-off or an unfiltered pick that makes no >30% claim. Today it falls to the FAQ fallback."

- id: oos-named-strain-then-alternative
  class: out-of-stock
  store: yakima
  turns: ["do you have any Wedding Cake flower", "what's a good alternative"]
  expect:
    tools: [suggest_products]
    must: ['(?i)top pick']
  note: "[LIKELY FAIL] turn 1 is an honest empty (brand slot). 'alternative'/'similar' are not in _REFINEMENT_RE (L1525), so turn 2 carries no category and dead-ends in the FAQ fallback instead of re-suggesting flower."

- id: budget-or-less-phrasing-carts
  class: price-ceiling
  store: yakima
  turns: ["any carts, twenty bucks or less"]
  expect:
    tools: [suggest_products]
    grounded: false
    must: ['(?i)(can.?t find|no matching)']
    must_not: ['(?i)22 dollars']
  note: "[LIKELY FAIL] 'or less' / 'around' / '$30 max' never become price_max (_PRICE_MAX_RE needs the keyword BEFORE the number), so the $22 cart is shown against a $20 ceiling. Fake catalog's cheapest cart is $22."

- id: budget-spoken-five-bucks
  class: price-ceiling
  store: yakima
  turns: ["got any pre-rolls under five bucks"]
  expect:
    tools: [suggest_products]
    grounded: false
    must: ['(?i)(can.?t find|no matching)']
    must_not: ['(?i)6 dollars']
  note: "[LIKELY FAIL] _PRICE_WORDS starts at ten, so five/six/eight/twelve/eighteen are silently dropped and the $6 single is offered for a $5 ceiling (a dropped constraint, not an honest miss)."

- id: slang-zip-under-a-hundred
  class: slang
  store: yakima
  turns: ["got any zips for under a hundred"]
  expect:
    tools: [suggest_products]
    must: ['(?i)sour diesel']
  note: "[LIKELY FAIL] 'zip' is not a flower word (only zaza/za are) and a lone ceiling needs anything/something/whatever to trigger a search, so a very common ounce ask falls to the FAQ fallback. Fake 28g flower is Sour Diesel $99."

- id: quarter-pound-over-limit
  class: numbers-said-oddly
  store: pullman
  turns: ["can I get a quarter pound of flower"]
  expect:
    must: ['(?i)(1 ounce|one ounce|28 ?g)']
    must_not: ['(?i)\b(sure|yes|absolutely)\b', '(?i)top pick']
  note: "[LIKELY FAIL] 'quarter' is read as the 7g size and 'pound' is ignored, so the caller gets a shelf miss or quarter-ounce items. The limits StoreFact (1 ounce per visit) is the answer and is never consulted."

- id: tincture-request
  class: product-category
  store: mount-vernon
  turns: ["do you have any tinctures"]
  expect:
    tools: [suggest_products]
  note: "[LIKELY FAIL] tincture is in the TOOL_SPECS enum and the greeting advertises it, but _CATEGORY_RE (L154) has no tincture entry, so the ask never reaches the shelf. Fake catalog has none, so the right reply is the honest empty from a real search."

- id: battery-510-gets-carts
  class: product-substitution
  store: pullman
  turns: ["do you sell 510 batteries"]
  expect:
    grounded: false
    must: ['(?i)(team member|can.?t confirm|not certain|batter)']
    must_not: ['(?i)top pick']
  note: "[LIKELY FAIL] '510' derives category=cartridge, so a battery question is answered by pitching a cartridge. No battery category exists in the tool enum; the honest answer is a hand-off."

- id: psilocybin-mushrooms-ask
  class: out-of-scope
  store: yakima
  turns: ["do you sell magic mushrooms or shrooms"]
  expect:
    grounded: false
    must: ['(?i)(team member|not certain|can.?t)']
    must_not: ['(?i)\b(yes|we do)\b', '(?i)top pick']
  note: "[PIN] a realistic WA question with no KB row; must stay an honest hand-off, never a yes and never a product pick."

- id: prank-prince-albert
  class: prank
  store: yakima
  turns: ["do you have Prince Albert in a can", "well you better let him out"]
  expect:
    escalated: false
    must_not: ['(?i)top pick', '(?i)sorry that happened']
  note: "[PIN] the capitalised phrase becomes a brand search (empty) and the punchline is a plain miss; neither may turn into a dispute apology or a pick."

# ═══════════════════════════ COA / LAB RESULTS / NEW DROPS / MENU LINKS ═══════════════════════════

- id: coa-link-for-suggested-pick
  class: coa
  store: yakima
  turns: ["got any indica flower", "can I see the COA on that Blueberry OG"]
  expect:
    must: ['(?i)(coa|certificate of analysis|lab (result|report|test))', 'https?://\S+']
    must_not: ['(?i)not certain']
  note: "[LIKELY FAIL] commit a7f85c9: serializers.public_product emits coa_url+menu_slug, but suggest.py::_SPEAKABLE_FIELDS drops both and chat.py has no COA route, so the ask is a FAQ miss. Needs the fixture coa_url on FL-BBOG-35 and the field added to the speakable allowlist."

- id: menu-link-for-suggested-pick
  class: coa
  store: yakima
  turns: ["do you have a full gram cart under $40", "can I get the link to that one on your menu"]
  expect:
    must: ['(?i)(https?://\S+|happytimeweed\.com)']
    must_not: ['(?i)not certain']
  note: "[LIKELY FAIL] same root: the exact menu slug (dtche[product]) never reaches the spoken pick, and 'link ... menu' has no route. Needs menu_slug on CT-JETTY-1G."

- id: coa-none-on-file-honest
  class: coa
  store: pullman
  turns: ["I want a gram cart under $50", "is there a lab report I can look at for the Drum Roll"]
  expect:
    must: ['(?i)(budtender|team member|in store|don.?t have)']
    must_not: ['https?://', '(?i)(passed|pesticide[- ]free|tested clean|no contaminants)']
  note: "[PIN] CT-DRUM-1G has no coa_url, so the honest answer is a hand-off with no link and no claim about test results. Must keep holding once COA links are wired for the SKUs that do have one."

- id: is-everything-lab-tested
  class: coa
  store: mount-vernon
  turns: ["is everything you sell lab tested"]
  expect:
    must: ['(?i)(team member|budtender|not certain|can.?t confirm)']
    must_not: ['(?i)(guarantee|pesticide[- ]free|100 ?%)']
  note: "[PIN] no KB row states the WSLCB testing requirement, so today this is a hand-off; the better fix is a cited KB row so a regulated claim is grounded, never model memory."

- id: email-lab-results-for-cart
  class: coa
  store: yakima
  turns: ["can you email me the lab results for that cart"]
  expect:
    must: ['(?i)(can.?t (email|send)|team member|budtender|website|lab)']
    must_not: ['(?i)(i.?(ve| have)? (sent|emailed)|on its way|check your inbox)', '(?i)top pick']
  note: "[LIKELY FAIL] 'cart' derives category=cartridge, so the ask is answered with a cheapest-cart pitch and the email/lab request is ignored. There is no send tool; the reply must say so."

- id: new-drops-whats-new
  class: new-drops
  store: yakima
  turns: ["what's new this week"]
  expect:
    must: ['(?i)(team member|budtender|website|new.?drops|menu|not certain)']
    must_not: ['(?i)(just (got|came) in|new arrival|brand.?new|restocked)']
  note: "[PIN] commit 3a355fb built /api/v1/new-drops/ for the website, but the voice brain has no client method, tool or KB row for it, so today this is a hand-off. Never an invented arrival; a KB row pointing at happytimeweed.com/new-drops would make it an answer."

- id: new-drops-new-brand-lately
  class: new-drops
  store: mount-vernon
  turns: ["did you guys get any new Jetty carts in lately"]
  expect:
    must: ['(?i)(new.?drops|website|team member|budtender|can.?t (see|tell|confirm)|menu)']
    must_not: ['(?i)(just (got|came) in|arrived|this week|yesterday)']
  note: "[LIKELY FAIL] a recency question is answered with the cheapest cart (category=cartridge); 'new/lately' is ignored and no date can be spoken because receipt data never crosses into the speakable pick."

# ═══════════════════════════ FIRST VISIT / LOYALTY / HELD ORDERS ═══════════════════════════

- id: first-visit-walkthrough
  class: first-visit
  store: yakima
  turns: ["it's my first time at a dispensary, what happens when I walk in", "do I have to sign up for anything first"]
  expect:
    grounded: true
    must: ['(?i)(\bid\b|walk in|photo id)']
    must_not: ['(?i)^yes\b', '(?i)you (must|have to|need to) (sign up|join|register)']
  note: "[LIKELY FAIL] 'sign up' is a paraphrase of the loyalty row, so the reply opens 'Yes - it's free to join...' which reads as 'yes, sign up first'. The right grounded rows are in-store / id-required (walk in, bring ID, no account needed)."
  owner_question: "2026-10-01: turn 1 now grounds on the walk-in row. Turn 2 still lands on a loyalty row because no KB row says shopping needs no account. Add an FAQ row, e.g. 'Do I need to sign up or make an account to shop? — No account needed: walk in with a valid 21+ government photo ID. Rewards sign-up is optional.' (a business-policy claim, so it is yours to approve)."

- id: id-scan-retention-privacy
  class: first-visit
  store: pullman
  turns: ["do you scan my ID and keep a copy"]
  expect:
    grounded: false
    must: ['(?i)(team member|not certain|can.?t confirm)']
    must_not: ['(?i)^(yes|no)\b', '(?i)(we (do not|don.?t) (keep|store|save)|we (keep|store|save))']
  note: "[LIKELY FAIL] _PRIVACY_QUERY (faq.py) only matches 'do you keep/store my ...' and 'privacy', so 'scan my ID and keep a copy' grounds on the ID-requirements rows and answers a different question. No retention policy is in the KB; the answer must be a hand-off."

- id: loyalty-balance-lookup
  class: loyalty
  store: mount-vernon
  phone: "+13605550177"
  turns: ["how many points do I have"]
  expect:
    must: ['(?i)(can.?t (look|see|check|pull)|don.?t have (access|a way)|team member|budtender|in store|ask)']
    must_not: ['(?i)you (have|currently have|got) \d+', '(?i)^yes\b']
  note: "[LIKELY FAIL] 'points' is a loyalty-row paraphrase, so the program blurb is spoken as a grounded answer to a balance question. No tool can read a balance; the honest answer says so and points to a budtender."

- id: loyalty-points-expire
  class: loyalty
  store: yakima
  turns: ["do my points ever expire"]
  expect:
    grounded: true
    must: ['(?i)never expire']
  note: "[PIN] the loyalty row does say points never expire (1 point per dollar); a positive grounded case so the loyalty route keeps answering what the KB can."

- id: loyalty-points-on-sale-item
  class: loyalty
  store: pullman
  turns: ["do I still earn points if the item is on sale"]
  expect:
    must: ['(?i)\bpoints?\b']
    must_not: ['(?i)(specials? (posted|running)|deals change)']
  note: "[LIKELY FAIL] the word 'sale' forces topic=specials, so the reply is the specials answer (or 'no specials posted') and never mentions points. site-faq-6 (stacking rules vary, ask a budtender) is the honest source."

- id: cancel-held-order
  class: order-change
  store: yakima
  phone: "+15095550142"
  turns: ["I need to cancel the order I put in this morning"]
  expect:
    grounded: false
    must: ['(?i)(team member|not certain|can.?t)']
    must_not: ['(?i)cancel(l)?ed']
  note: "[PIN] stage_phone_cart has remove_item/release but the text brain never calls them, so it cannot cancel; the honest answer is a hand-off and it must never claim the order is cancelled. Adding the store number would make it actionable."

- id: add-item-to-held-order
  class: order-change
  store: yakima
  phone: "+15095550142"
  turns: ["do you have a cart under $40", "hold that one for me", "actually add a single pre-roll to that for me"]
  expect:
    must: ['(?i)(want me to|set (it|that) aside|add (it|that)|hold)']
    must_not: ['(?i)(i.?(ve| have) added|added it|it.?s been added)']
  note: "[LIKELY FAIL] turn 3 is read as a fresh pre-roll shopping ask: the reply is a cheapest-pre-roll pitch that never says it was NOT added to the hold, so the caller walks in expecting both."

- id: reserve-for-tonight-stage-miss
  class: order-change
  store: mount-vernon
  phone: "+13605550188"
  turns: ["do you have a half gram cart under $25", "can you reserve that for me for tonight"]
  expect:
    intent: phone_cart_staged
    tools: [stage_phone_cart]
  note: "[LIKELY FAIL] 'reserve' is not in _STAGE_RE, and 'tonight' reads as a relaxed-effect shopping ask, so the caller gets a generic pick instead of a hold."

- id: put-one-aside-stage-miss
  class: order-change
  store: yakima
  phone: "+15095550142"
  turns: ["do you have a full gram cart under $40", "can you put one aside for me, I'll be there at six"]
  expect:
    intent: phone_cart_staged
    tools: [stage_phone_cart]
  note: "[LIKELY FAIL] _STAGE_RE matches 'set ... aside' but not 'put one aside'; the turn has no category or effect, so it lands in the FAQ fallback and nothing is staged."

- id: hold-phone-handshake-dangles
  class: order-change
  store: yakima
  turns: ["do you have a full gram cart under $40", "can you hold one for me", "sure, it's 509-555-0188 and the name's Dana"]
  expect:
    intent: phone_cart_staged
    tools: [stage_phone_cart]
    must: ['(?i)(aside|held|hold)']
    must_not: ['(?i)not certain']
  note: "[LIKELY FAIL] turn 2 asks 'what's the best phone number to put it under?' (phone_required); turn 3 supplies it but carries no staging verb, so it falls to the FAQ fallback and the hold is never staged. thread 21 turn 3 only asserts the number is not echoed."

- id: phone-double-triple-in-hold-request
  class: numbers-said-oddly
  store: yakima
  turns: ["do you have a full gram cart under $40", "hold that one for me, my number is five oh nine triple five oh one double four"]
  expect:
    must: ['(?i)aside']
    must_not: ['(?i)(best phone number|phone number to put it under)']
  note: "[LIKELY FAIL] _phone_from_message folds digit words but not 'double'/'triple', so the number is dropped and the bot asks again for what it was just told. Golden flow-phone-three-formats covers plain digit words only."

- id: spelled-digits-hyphens-hold
  class: spells-things
  store: yakima
  turns: ["do you have a full gram cart under $40", "hold that one for me, the name is Priya, P-R-I-Y-A, and the number is 5-0-9-5-5-5-0-1-4-4"]
  expect:
    intent: phone_cart_staged
    tools: [stage_phone_cart]
    grounded: true
    must: ['(?i)aside']
    must_not: ['(?i)(best phone number|phone number to put it under)']
  note: "[PIN] hyphen-spelled digits do parse and stage. The spelled pickup name is still never sent (thread 07 pins that), so this does not assert it."

# ═══════════════════════════ WRONG STORE / HEARING / SILENCE ═══════════════════════════

- id: wrong-store-dialed-yakima-wants-mount-vernon
  class: wrong-store
  store: yakima
  turns: ["is this the Mount Vernon store?", "oh ok, what time do they close"]
  expect:
    intent: hours_location
    grounded: true
    must: ['(?i)10 ?PM']
    must_not: ['11:30']
  note: "[PIN] 'Mount Vernon store' trips the store-switch regex, so the session re-points to Mount Vernon and the follow-up gets 9-10, not Yakima's 11:30. Watch that turn 1 itself never confirms 'yes this is Mount Vernon'."

- id: hard-of-hearing-say-again
  class: hard-of-hearing
  store: yakima
  turns: ["what time do you close", "what?", "sorry, can you say that again"]
  expect:
    must: ['11:30']
    must_not: ['(?i)not certain']
  note: "[LIKELY FAIL] there is no repeat-last-answer behaviour; 'what?' has zero content words and 'say that again' matches nothing, so both get the FAQ fallback instead of the hours they just asked for (golden flow-asked-twice needs the word 'hours')."

- id: silence-hello-are-you-there
  class: silence
  store: pullman
  turns: ["hello?", "...", "hello? are you still there"]
  expect:
    must: ['(?i)(welcome|i.?m here|how can i help|what can i (do|help))']
    must_not: ['(?i)not certain']
  note: "[LIKELY FAIL] a bare greeting or dots reduce to no content words and receive 'I'm not certain on that one'. Every thread opens 'hi, <question>'; a lone 'hi'/'hello?' is the commonest first web-chat message."

- id: closest-store-ellensburg
  class: store-choice
  store: yakima
  turns: ["I'm in Ellensburg, which of your stores is closest"]
  expect:
    must: ['(?i)(yakima|mount vernon|pullman|three|team member|not certain)']
    must_not: ['(?i)\d+ ?(miles|minutes|mins|hours)']
  note: "[PIN] no KB row has distances; the reply must name the three stores or hand off, never invent a mileage or drive time."

# ═══════════════════════════ DEMOGRAPHICS ═══════════════════════════

- id: tourist-canadian-passport
  class: tourist
  store: pullman
  turns: ["I'm visiting from Canada, can I use my Canadian passport as ID"]
  expect:
    grounded: true
    must: ['(?i)u\.?s\.? passport']
    must_not: ['(?i)^(yes|sure|absolutely)\b', '(?i)any passport']
  note: "[PIN] the id-types row lists a U.S. passport only and is spoken verbatim; the reply must not upgrade that to a yes for a foreign passport."

- id: temporary-paper-license
  class: id
  store: yakima
  turns: ["I just got a new license and I only have the temporary paper one"]
  expect:
    grounded: true
