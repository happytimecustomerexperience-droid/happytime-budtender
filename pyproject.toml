[project]
name = "happytime-budtender"
version = "0.1.0"
description = "Happy Time AI Budtender — self-contained suggestions + pairing backend (Dutchie-synced, margin-first)."
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "django-celery-beat>=2.7",
    "gunicorn>=23.0",
    "google-genai>=1.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "phonenumbers>=8.13",
    # ── merged-in POS (pos/ + dutchie/ + idscan/ + pos_core/) ──
    "whitenoise>=6",        # static serving for the login-gated POS screens
    "curl_cffi>=0.7",       # Chrome-TLS impersonation for the Dutchie register client
    "cryptography>=42",     # Fernet at-rest encryption for Dutchie store secrets
    "Pillow>=10",           # upload magic-byte / decompression-bomb guard (id-scan)
    "zxing-cpp>=2",         # LOCAL PDF417 barcode decode for id-scan (no cloud OCR)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["budtender", "pos", "customers", "idscan", "dutchie", "tests"]

[tool.uv]
package = false
